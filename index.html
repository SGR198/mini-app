<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Staff Cost</title>
  <link rel="stylesheet" href="./styles.css" />
  <script src="https://telegram.org/js/telegram-web-app.js?63"></script>
</head>
<body>
  <main class="screen">
    <section id="not-found" class="state-screen">
      <h1>Страница не найдена</h1>
    </section>

    <section id="app" class="app" hidden>
      <header class="page-header">
        <h1>Начисления сотрудников</h1>
      </header>

      <section class="period-panel" aria-label="Выбор периода">
        <div id="period-selector" class="period-selector" role="group" aria-label="Период начислений">
          <button type="button" class="period-button" data-period="all" aria-pressed="true">Все</button>
          <button type="button" class="period-button" data-month="7" aria-pressed="true">Июль</button>
          <button type="button" class="period-button" data-month="8" aria-pressed="true">Август</button>
          <button type="button" class="period-button" data-month="9" aria-pressed="true">Сентябрь</button>
        </div>
      </section>

      <section class="total-card" aria-label="Итого начислено">
        <span class="total-label">Итого начислено</span>
        <strong id="total-accrual" class="total-amount money">0 ₽</strong>
      </section>

      <div id="employee-list" class="employee-list"></div>
    </section>
  </main>

  <script src="./app.js"></script>
</body>
</html>
